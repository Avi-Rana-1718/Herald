server:
  port: 6069
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: herald
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    validate-migration-naming: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  redis:
    host: localhost
    port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BROKER_URL}
    consumer:
      group-id: my-consumer-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: '*'
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: MANUAL_IMMEDIATE
mail:
  mailjet:
    username: ${MAILJET_APIKEY}
    password: ${MAILJET_SECRET}
    baseURL: "https://api.mailjet.com/v3.1/"
    email: budgr@avirana.com
    name: Avi Rana
sms:
  twilio:
    baseUrl: ${TWILIO_BASEURL}
    username: ${TWILIO_USERNAME}
    password: ${TWILIO_PASSWORD}
    serviceId: ${TWILIO_SERVICE_ID}
