server:
  port: 6069
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: herald
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    validate-migration-naming: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  # Security is env-driven. Defaults match the plaintext broker in
  # docker-compose.yaml; the managed broker needs KAFKA_SECURITY_PROTOCOL=SASL_SSL
  # plus KAFKA_USERNAME / KAFKA_PASSWORD. Under PLAINTEXT the SASL and SSL keys
  # below are never read, so they are harmless to leave in place.
  kafka:
    bootstrap-servers: ${KAFKA_BROKER_URL:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      ssl.endpoint.identification.algorithm: https
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
      # Broker CA inlined via Kafka's PEM store (2.7+): no keystore file to ship,
      # no truststore password, nothing to mount. See kafka.ssl.ca-pem below.
      ssl.truststore.type: PEM
      ssl.truststore.certificates: ${KAFKA_CA_PEM:${kafka.ssl.ca-pem}}
      socket.connection.setup.timeout.ms: 30000
      socket.connection.setup.timeout.max.ms: 60000
    consumer:
      group-id: my-consumer-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: MANUAL_IMMEDIATE
management:
  health:
    redis:
      enabled: false
kafka:
